name: 'RedPennon Code References'
description: 'Scan the repository for feature-flag variable references and push them to RedPennon.'
author: 'RedPennon'
branding:
  icon: 'toggle-right'
  color: 'red'
inputs:
  api-token:
    description: 'Organisation API token (rpa_...). Store it as a repository secret.'
    required: true
  project:
    description: 'Project key the references belong to.'
    required: true
  api-url:
    description: 'API base URL override (self-hosted / development).'
    required: false
  working-directory:
    description: 'Directory to scan, relative to the workspace (default: the workspace root). Useful in monorepos.'
    required: false
  config-path:
    description: 'Path to a RedPennon config file, relative to the working directory (default: .redpennon/config.yml).'
    required: false
  fail-on-unknown:
    description: 'Fail the step if the API reports keys that are not in the project.'
    required: false
    default: 'false'
  max-references:
    description: 'Fail instead of publishing more than this many references (default: 2000).'
    required: false
outputs:
  accepted:
    description: 'Number of references accepted.'
  matched:
    description: 'Number of references matched to a project variable.'
  unknown-keys:
    description: 'Comma-separated keys that did not match any project variable.'
runs:
  using: 'node24'
  main: 'action/index.cjs'
