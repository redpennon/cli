name: Release

# Triggered by pushing a version tag: git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create a GitHub Release
      id-token: write  # needed for npm provenance attestation

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate oclif manifest
        run: npm run manifest

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: |
          chmod +x bin/run.js
          CURRENT=$(node -p "require('./package.json').version")
          # Check if this exact version is already published; if so, skip publish
          # but still ensure the dist-tag is correct (handles re-runs on the same tag).
          ALREADY=$(npm view @redpennon/cli@${CURRENT} version 2>/dev/null || echo "")
          if [ "$ALREADY" = "$CURRENT" ]; then
            echo "Version ${CURRENT} already published, skipping publish step."
          else
            LATEST=$(npm view @redpennon/cli@latest version 2>/dev/null || echo "0.0.0")
            HIGHER=$(printf '%s\n' "$LATEST" "$CURRENT" | sort -V | tail -1)
            if [ "$HIGHER" = "$LATEST" ] && [ "$LATEST" != "$CURRENT" ]; then
              npm publish --access public --provenance --tag next
            else
              npm publish --access public --provenance
            fi
          fi
          npm dist-tag add @redpennon/cli@${CURRENT} latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true

      # Consumers (including RedPennon's own app/admin dogfood workflows) pin
      # `redpennon/cli@v1`; move that floating major tag to each stable release.
      - name: Move floating major tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
