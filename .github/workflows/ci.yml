name: CI

# Audit finding #17. The repository had a release workflow but nothing
# running its test suite on a pull request, so a regression only
# surfaced at publish time via prepublishOnly.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
