name: CI

# Audit finding #17. The repository had a release workflow but nothing
# running its test suite on a pull request, so a regression only
# surfaced at publish time via prepublishOnly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Test with coverage (80% line threshold)
        run: npm run test:coverage
      - name: Verify action bundle is up to date
        run: |
          npm run action:build
          git diff --exit-code action/index.cjs
