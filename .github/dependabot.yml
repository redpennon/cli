version: 2

# Audit finding #17. Dependency and GitHub Action versions move silently
# unless something proposes the bump. Dependabot makes that movement
# visible and reviewable (npm dependencies and pinned action SHAs).
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
